name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/determined-pascal-ag2z3y]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site && cp index.html tasks.js tasks2.js tasks3.js tasks4.js tasks_en.js manifest.webmanifest icon.svg icon.png sw.js site/
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
