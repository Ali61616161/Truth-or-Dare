<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doğruluk Cesaret">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<title>Doğruluk mu Cesaret mi</title>
<style>
:root{--bg:#120b0d;--surf:#1b1215;--surf2:#241a1d;--line:#3a2b2f;--txt:#f5ede6;--mut:#a8949a;--acc:#e5484d;--acc2:#d9a566;--serif:ui-serif,"New York",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-size:44px;line-height:1.02;margin:6px 0 10px;font-weight:700;letter-spacing:-1px}
h1 em{color:var(--acc);font-style:italic;font-weight:600}
h2{font-family:var(--serif);font-size:30px;margin:14px 0 6px;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 22px;font-size:15px;line-height:1.5}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc2);font-weight:600}
.btn{border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:600;color:var(--txt);background:var(--surf);width:100%;font-family:inherit;transition:transform .1s,background .15s;display:block;text-align:center}
.btn:active{transform:scale(.98);background:var(--surf2)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.gold{background:var(--acc2);border-color:var(--acc2);color:#1b1215}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);font-size:14px;padding:12px}
.btn[disabled]{opacity:.3;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.mode{display:flex;gap:16px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:20px;color:var(--txt);width:100%;text-align:left;font:inherit;transition:transform .1s,border-color .15s}
.mode:active{transform:scale(.985);border-color:var(--acc)}
.mode .num{width:34px;flex:0 0 34px;font-family:var(--serif);font-size:36px;line-height:1;color:var(--acc);font-style:italic}
.mode b{font-family:var(--serif);font-size:23px;display:block;margin-bottom:4px;font-weight:700}
.mode span{color:var(--mut);font-size:14px;line-height:1.45}
input[type=text]{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--txt);font-size:17px;font-family:inherit;-webkit-user-select:text;user-select:text;outline:none}
input[type=text]:focus{border-color:var(--acc2)}
.seg{display:flex;gap:10px;margin:12px 0 14px}
.seg button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--mut);font-size:16px;font-weight:600;font-family:inherit}
.seg button.on{border-color:var(--acc2);color:var(--txt);background:var(--surf2)}
.plist{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.player{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);padding:12px 14px;border-radius:14px;font-size:17px}
.player .av{width:34px;height:34px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--acc2)}
.player span.n{flex:1}
.player button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.top button{background:none;border:0;color:var(--mut);font-size:15px;padding:8px 0;font-family:inherit}
.meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.turn{margin:14px 0 6px}
.turn .who{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:-.8px;line-height:1.05}
.passes{display:flex;gap:7px;align-items:center;color:var(--mut);font-size:13px;margin:8px 0 14px}
.passes i{width:10px;height:10px;border-radius:50%;background:var(--acc2);display:inline-block}
.passes i.off{background:transparent;border:1.5px solid var(--line)}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.lv button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;font-weight:600;font-family:inherit}
.lv button.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}
.lvnote{font-size:12px;color:var(--mut);margin:2px 0 10px;min-height:16px}
.card{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:26px 22px;margin:10px 0 14px;min-height:240px;display:flex;flex-direction:column;justify-content:center;animation:in .25s}
.card .kind{font-size:12px;letter-spacing:.2em;font-weight:700;margin-bottom:16px;color:var(--acc2)}
.card.dare .kind{color:var(--acc)}
.card .txt{font-family:var(--serif);font-size:25px;line-height:1.35;font-weight:600}
.card.empty .txt{color:var(--mut);font-weight:500;font-style:italic}
.spacer{flex:1}
.timer{margin:0 0 10px;text-align:center}
.timer button{background:transparent;border:1px solid var(--acc2);color:var(--acc2);border-radius:99px;padding:9px 22px;font-size:15px;font-weight:600;font-family:inherit}
.timer .big{font-family:var(--serif);font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.warn{background:var(--surf);border:1px solid var(--acc);border-radius:16px;padding:18px;font-size:15px;color:var(--txt);margin:14px 0;line-height:1.55}
.tip{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:in .2s}
.modal>div{background:var(--surf);border-radius:22px 22px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 22px);width:100%;max-width:520px;border:1px solid var(--line)}
.langs{display:inline-flex;gap:4px}.langs button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.08em}.langs button.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}
</style>
</head>
<body>
<div id="app"></div>
<script src="tasks.js"></script>
<script src="tasks2.js"></script>
<script src="tasks3.js"></script>
<script src="tasks4.js"></script>
<script src="tasks_en.js"></script>
<script>
"use strict";
const MAX_PASS=3;
const KEY='tod_v3',LKEY='tod_lang';
const STR={
 tr:{
  title:'Doğruluk mu Cesaret mi',h1a:'Doğruluk',h1b:'mu',h1c:'Cesaret',h1d:' mi?',eyebrow:'Oyun',
  sub:'Reklamsız, ücretsiz, tamamen Türkçe. Bir mod seç ve başla.',
  friend:'Arkadaş',friendD:'Komik, samimi, eğlenceli. İki veya daha fazla oyuncu.',
  couple:'Sevgili',coupleD:'Çiftler için. Yavaş yavaş kızışan, fiziksel görevler. 18+',
  iosTip:'Uygulama gibi kullanmak için Safari’de Paylaş, ardından Ana Ekrana Ekle’ye dokun.',
  reset:'Görev geçmişini sıfırla',resetQ:'Tüm görev geçmişi sıfırlansın mı? Görevler baştan gelmeye başlar.',resetOk:'Sıfırlandı',
  adultH:'Yetişkinlere özel',adultW:'Sevgili modu yetişkin çiftler içindir. Tüm görevler <b>karşılıklı rıza</b> ile yapılmalıdır. Her oyuncunun {n} pas hakkı var; rahatsız olduğun bir şeyi her zaman durdurabilirsin. Birbirinizin sınırlarına saygı gösterin.',
  adultOk:'18 yaşından büyüğüm, devam',back:'Geri',
  coupleInfo:'Çift bilgileri',players:'Oyuncular',coupleSub:'İkinizin de adını ve cinsiyetini girin.',friendSub:'En az iki oyuncu ekle. Sırayla oynanır.',
  name:'İsim',male:'Erkek',female:'Kadın',add:'Oyuncu ekle',startGame:'Oyunu başlat',
  needName:'Bir isim yaz',needGender:'Cinsiyet seç',dupName:'Bu isim zaten var',needTwo:'En az 2 oyuncu gerekli',
  round:'Tur',turn:'Sıra',passLeft:'Pas hakkı',truth:'Doğruluk',dare:'Cesaret',TRUTH:'DOĞRULUK',DARE:'CESARET',
  choose:'Seçimini yap, {n}.',done:'Tamamladım',pass:'Pas geç · {n} hak kaldı',noPass:'Pas hakkın bitti. Görevi yapmalısın.',
  menu:'Menü',menuBack:'‹ Menü',cont:'Devam et',chPlayers:'Oyuncuları değiştir',home:'Ana menü',
  auto:'Oto',random:'Rastgele',lv:['','Isınma','Ateşli','Çılgın','Sınırsız'],
  nAuto:'Her 3 turda bir seviye yükselir. Şu an: {l}',nRandom:'Her görev rastgele bir seviyeden gelir.',nFixed:'Sabit seviye: {l}',
  timer:'Sayaç',timeUp:'Süre doldu',noTask:'Bu kategoride görev bulunamadı',err:'Bir hata oluştu',restart:'Yeniden başlat',noLoad:'Görevler yüklenemedi. Sayfayı yenile.'
 },
 en:{
  title:'Truth or Dare',h1a:'Truth',h1b:'or',h1c:'Dare',h1d:'?',eyebrow:'The game',
  sub:'No ads, free, works offline. Pick a mode and start.',
  friend:'Friends',friendD:'Funny, casual, playful. Two or more players.',
  couple:'Couples',coupleD:'For couples. Physical tasks that heat up step by step. 18+',
  iosTip:'To use it like an app, tap Share in Safari, then Add to Home Screen.',
  reset:'Reset task history',resetQ:'Reset all task history? Tasks will start coming from the beginning again.',resetOk:'Reset done',
  adultH:'Adults only',adultW:'Couples mode is for adult couples. Every task must be done with <b>mutual consent</b>. Each player has {n} passes; you can stop anything you are not comfortable with at any time. Respect each other’s limits.',
  adultOk:'I am over 18, continue',back:'Back',
  coupleInfo:'Couple details',players:'Players',coupleSub:'Enter both names and genders.',friendSub:'Add at least two players. You play in turns.',
  name:'Name',male:'Male',female:'Female',add:'Add player',startGame:'Start game',
  needName:'Enter a name',needGender:'Pick a gender',dupName:'That name already exists',needTwo:'At least 2 players are needed',
  round:'Round',turn:'Turn',passLeft:'Passes',truth:'Truth',dare:'Dare',TRUTH:'TRUTH',DARE:'DARE',
  choose:'Make your choice, {n}.',done:'Done',pass:'Pass · {n} left',noPass:'You are out of passes. You have to do the task.',
  menu:'Menu',menuBack:'‹ Menu',cont:'Continue',chPlayers:'Change players',home:'Main menu',
  auto:'Auto',random:'Random',lv:['','Warm-up','Hot','Wild','Unlimited'],
  nAuto:'The level goes up every 3 rounds. Now: {l}',nRandom:'Every task comes from a random level.',nFixed:'Fixed level: {l}',
  timer:'Timer',timeUp:'Time is up',noTask:'No task found in this category',err:'Something went wrong',restart:'Restart',noLoad:'Tasks could not be loaded. Refresh the page.'
 }
};
let LANG='tr';
try{const s=localStorage.getItem(LKEY);LANG=s||((navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en')}catch(e){}
const t=(k,v)=>{let s=(STR[LANG]||STR.tr)[k];if(s===undefined)s=STR.tr[k];if(typeof s==='string'&&v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const LVN=l=>t('lv')[l];
const S={mode:null,players:[],turn:0,lvMode:'auto',task:null,tmpG:null,hist:{},passes:[],timer:null,tleft:0};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify({hist:S.hist}))}catch(e){}}
function restore(){try{S.hist=JSON.parse(localStorage.getItem(KEY)||'{}').hist||{}}catch(e){S.hist={}}}
function setLang(l){LANG=l;try{localStorage.setItem(LKEY,l)}catch(e){}document.documentElement.lang=l;document.title=t('title');home()}
function render(html){clearTimer();app.style.animation='none';void app.offsetWidth;app.style.animation='';app.innerHTML=html;window.scrollTo(0,0)}

function home(){
 S.task=null;
 const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 render(`<div class="top"><span></span><span class="langs"><button class="${LANG==='tr'?'on':''}" onclick="setLang('tr')">TR</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button></span></div>
 <div class="spacer"></div>
 <div class="eyebrow">${t('eyebrow')}</div>
 <h1>${t('h1a')}<br>${t('h1b')} <em>${t('h1c')}</em>${t('h1d')}</h1>
 <p class="sub">${t('sub')}</p>
 <div class="stack">
  <button class="mode" onclick="pickMode('friend')"><div class="num">I</div><div><b>${t('friend')}</b><span>${t('friendD')}</span></div></button>
  <button class="mode" onclick="pickMode('couple')"><div class="num">II</div><div><b>${t('couple')}</b><span>${t('coupleD')}</span></div></button>
 </div>
 <div class="spacer"></div>
 ${!standalone&&ios?`<p class="tip">${t('iosTip')}</p>`:''}
 <button class="btn ghost" onclick="resetHist()">${t('reset')}</button>`);
}
function resetHist(){if(confirm(t('resetQ'))){S.hist={};persist();alert(t('resetOk'))}}
function pickMode(m){
 if(m==='couple'){
  render(`<div class="spacer"></div><div class="eyebrow">18+</div><h2>${t('adultH')}</h2>
  <div class="warn">${t('adultW',{n:MAX_PASS})}</div>
  <div class="stack"><button class="btn main" onclick="setMode('couple')">${t('adultOk')}</button>
  <button class="btn ghost" onclick="home()">${t('back')}</button></div><div class="spacer"></div>`);
 } else setMode('friend');
}
function setMode(m){S.mode=m;S.players=[];S.tmpG=null;setup()}
function setup(keep){
 const c=S.mode==='couple';
 const full=c&&S.players.length>=2;
 const ready=S.players.length>=2;
 const list=S.players.map((p,i)=>`<div class="player"><div class="av">${esc(p.n[0].toUpperCase())}</div><span class="n">${esc(p.n)} <small style="color:var(--mut)">· ${p.g==='e'?t('male'):t('female')}</small></span><button aria-label="x" onclick="rmPlayer(${i})">✕</button></div>`).join('');
 render(`<div class="top"><button onclick="home()">‹ ${t('back')}</button><span class="meta">${c?t('couple'):t('friend')}</span></div>
 <h2>${c?t('coupleInfo'):t('players')}</h2>
 <p class="sub">${c?t('coupleSub'):t('friendSub')}</p>
 <div class="plist">${list}</div>
 ${full?'':`<input id="nm" type="text" maxlength="16" placeholder="${t('name')}" autocomplete="off" autocapitalize="words" enterkeyhint="done">
 <div class="seg"><button class="${S.tmpG==='e'?'on':''}" onclick="setG('e')">${t('male')}</button><button class="${S.tmpG==='k'?'on':''}" onclick="setG('k')">${t('female')}</button></div>
 <button class="btn gold" onclick="addPlayer()">${t('add')}</button>`}
 <div class="spacer"></div>
 <button class="btn main" style="margin-top:18px" ${ready?'':'disabled'} onclick="start()">${t('startGame')}</button>`);
 const i=document.getElementById('nm');if(i){if(keep)i.value=keep;i.addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()})}
}
function setG(g){const v=(document.getElementById('nm')||{}).value||'';S.tmpG=g;setup(v)}
function addPlayer(){
 const n=(document.getElementById('nm').value||'').trim();
 if(!n){alert(t('needName'));return}
 if(!S.tmpG){alert(t('needGender'));return}
 if(S.players.some(p=>p.n.toLowerCase()===n.toLowerCase())){alert(t('dupName'));return}
 S.players.push({n,g:S.tmpG});S.tmpG=null;setup();
}
function rmPlayer(i){S.players.splice(i,1);setup()}
function start(){
 if(S.players.length<2){alert(t('needTwo'));return}
 S.turn=0;S.lvMode='auto';S.task=null;S.passes=S.players.map(()=>MAX_PASS);persist();game();
}

const cur=()=>S.players[S.turn%S.players.length];
const curIdx=()=>S.turn%S.players.length;
const roundNo=()=>Math.floor(S.turn/S.players.length)+1;
function autoLevel(){return Math.min(4,1+Math.floor((roundNo()-1)/3))}
function effLevel(){
 if(S.lvMode==='auto')return autoLevel();
 if(S.lvMode==='random')return 1+Math.floor(Math.random()*4);
 return S.lvMode;
}
function lvNote(){
 if(S.lvMode==='auto')return t('nAuto',{l:LVN(autoLevel())});
 if(S.lvMode==='random')return t('nRandom');
 return t('nFixed',{l:LVN(S.lvMode)});
}
function partnerOf(o){const others=S.players.filter(p=>p!==o);return others[Math.floor(Math.random()*others.length)]}
function game(){
 const o=cur(),c=S.mode==='couple';
 const left=S.passes[curIdx()];
 const dots=Array.from({length:MAX_PASS},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('');
 const opts=[['auto',t('auto')],['random',t('random')],[1,LVN(1)],[2,LVN(2)],[3,LVN(3)],[4,LVN(4)]];
 const lvbar=c?`<div class="lv">${opts.map(([v,n])=>`<button class="${S.lvMode===v?'on':''}" onclick="setLv('${v}')">${n}</button>`).join('')}</div><div class="lvnote">${lvNote()}</div>`:'';
 const tk=S.task;
 let body;
 if(tk){
  const secs=timeOf(tk.text);
  body=`<div class="card ${tk.kind}"><div class="kind">${tk.kind==='truth'?t('TRUTH'):t('DARE')}${c&&tk.lv?' · '+LVN(tk.lv).toUpperCase():''}</div><div class="txt">${esc(tk.text)}</div></div>
  ${secs?`<div class="timer" id="tm"><button onclick="startTimer(${secs})">${t('timer')} · ${fmt(secs)}</button></div>`:''}
  <div class="stack"><button class="btn main" onclick="done()">${t('done')}</button>
  <button class="btn" ${left?'':'disabled'} onclick="pas()">${t('pass',{n:left})}</button></div>`;
 } else {
  body=`<div class="card empty"><div class="txt">${esc(t('choose',{n:o.n}))}</div></div>
  <div class="row"><button class="btn gold" onclick="pick('truth')">${t('truth')}</button><button class="btn main" onclick="pick('dare')">${t('dare')}</button></div>`;
 }
 render(`<div class="top"><button onclick="menu()">${t('menuBack')}</button><span class="meta">${t('round')} ${roundNo()}</span></div>
 <div class="turn"><div class="meta">${t('turn')}</div><div class="who">${esc(o.n)}</div></div>
 <div class="passes">${t('passLeft')} ${dots}</div>
 ${lvbar}${body}<div class="spacer"></div>`);
}
function menu(){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="stack"><h2 style="margin:0 0 6px">${t('menu')}</h2><button class="btn" id="mm1">${t('cont')}</button><button class="btn" id="mm2">${t('chPlayers')}</button><button class="btn" id="mm3">${t('home')}</button></div>`;
 document.body.appendChild(m);
 const close=()=>m.remove();
 m.addEventListener('click',e=>{if(e.target===m)close()});
 m.querySelector('#mm1').onclick=close;
 m.querySelector('#mm2').onclick=()=>{close();setup()};
 m.querySelector('#mm3').onclick=()=>{close();home()};
}
function setLv(v){S.lvMode=(v==='auto'||v==='random')?v:Number(v);S.task=null;game()}
/* Havuz: TR dizisi kimlik (geçmiş için), EN dizisi aynı sıradaki çeviri */
function srcArr(src,kind,lv){
 if(!src)return null;
 return S.mode==='couple'?((src.couple||{})[kind]||{})[lv]:(src.friend||{})[kind];
}
function poolFor(kind,o,lv){
 const tr=srcArr(TASKS,kind,lv);
 if(!Array.isArray(tr)||!tr.length)return [];
 const en=(LANG==='en'&&typeof TASKS_EN!=='undefined')?srcArr(TASKS_EN,kind,lv):null;
 const out=[];
 tr.forEach((s,i)=>{
  const m=/^([ek])\|/.exec(s);if(m&&m[1]!==o.g)return;
  const id=s.replace(/^[ek]\|/,'');
  const txt=(en&&en[i])?en[i].replace(/^[ek]\|/,''):id;
  out.push({id,text:txt});
 });
 return out;
}
function pick(kind){
 const o=cur();let lv=effLevel();
 const keyOf=l=>[S.mode,kind,S.mode==='couple'?l:0].join('.');
 let base=poolFor(kind,o,lv);
 if(!base.length){alert(t('noTask'));return}
 let used=S.hist[keyOf(lv)]=S.hist[keyOf(lv)]||[];
 let avail=base.filter(x=>!used.includes(x.id)),useLv=lv;
 if(!avail.length&&S.mode==='couple'){
  for(const l of [lv+1,lv-1,lv+2,lv-2,lv+3,lv-3]){
   if(l<1||l>4)continue;
   const u2=S.hist[keyOf(l)]=S.hist[keyOf(l)]||[];
   const a2=poolFor(kind,o,l).filter(x=>!u2.includes(x.id));
   if(a2.length){avail=a2;useLv=l;break}
  }
 }
 if(!avail.length){S.hist[keyOf(lv)]=[];avail=base;useLv=lv}
 const x=avail[Math.floor(Math.random()*avail.length)];
 S.hist[keyOf(useLv)].push(x.id);persist();
 const p=S.mode==='couple'?(S.players.find(y=>y!==o)||o):partnerOf(o);
 S.task={kind,lv:S.mode==='couple'?useLv:0,text:x.text.replace(/\{p\}/g,p.n).replace(/\{o\}/g,o.n)};
 vib(15);game();
}
function advance(){S.task=null;S.turn++;game()}
function done(){vib([10,30,10]);advance()}
function pas(){
 const i=curIdx();
 if(S.passes[i]<=0){alert(t('noPass'));return}
 S.passes[i]--;advance();
}
function timeOf(s){const m=/(\d+)[\s-]*(saniye|dakika|dk|seconds?|minutes?|sec|min)/i.exec(s);if(!m)return 0;const n=+m[1];return /^(sa|se)/i.test(m[2])?n:n*60}
const fmt=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s} ${LANG==='en'?'sec':'sn'}`;
function clearTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function startTimer(sec){
 clearTimer();S.tleft=sec;const box=document.getElementById('tm');
 const show=()=>{box.innerHTML=`<div class="big">${S.tleft>=60?fmt(S.tleft):S.tleft}</div>`};show();
 S.timer=setInterval(()=>{S.tleft--;if(S.tleft<=0){clearTimer();box.innerHTML=`<div class="big">${t('timeUp')}</div>`;vib([200,100,200])}else show()},1000);
}
window.addEventListener('error',e=>{app.innerHTML=`<div class="warn">${t('err')}: ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">${t('restart')}</button></div>`});
document.documentElement.lang=LANG;document.title=t('title');
if(typeof TASKS==='undefined'){app.innerHTML=`<div class="warn">${t('noLoad')}</div>`}
else{restore();home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
