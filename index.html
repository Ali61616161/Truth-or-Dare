<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#14061f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Doğruluk mu Cesaret mi</title>
<style>
:root{--bg:#14061f;--card:#22103a;--card2:#2d1750;--txt:#fff;--mut:#b9a6d6;--pink:#ff3d81;--org:#ff8a3d;--blue:#4da3ff;--red:#ff2d55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(circle at 20% 0%,#3a0f5c 0,transparent 50%),radial-gradient(circle at 100% 100%,#5c0f3a 0,transparent 50%),var(--bg);background-attachment:fixed}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1{font-size:30px;margin:8px 0 4px;text-align:center}
h2{font-size:22px;margin:6px 0 14px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 20px;font-size:15px}
.btn{border:0;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:700;color:#fff;background:var(--card2);width:100%;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--org))}
.btn.blue{background:linear-gradient(135deg,#4da3ff,#7b5cff)}
.btn.red{background:linear-gradient(135deg,#ff2d55,#b0003a)}
.btn.ghost{background:transparent;border:1px solid #5a3a8a;color:var(--mut);font-size:15px;padding:12px}
.btn.sm{width:auto;padding:10px 16px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.modecard{background:var(--card);border-radius:22px;padding:22px;text-align:left;border:2px solid transparent;cursor:pointer;color:#fff;width:100%;font:inherit}
.modecard:active{transform:scale(.98)}
.modecard b{font-size:22px;display:block;margin-bottom:6px}
.modecard span{color:var(--mut);font-size:15px}
.modecard.f{border-color:#4da3ff55}.modecard.c{border-color:#ff3d8155}
input[type=text]{flex:1;min-width:0;padding:14px;border-radius:14px;border:1px solid #5a3a8a;background:var(--card);color:#fff;font-size:17px}
.gbtn{flex:0 0 auto;padding:14px 16px;border-radius:14px;border:2px solid #5a3a8a;background:var(--card);color:var(--mut);font-size:17px;font-weight:700}
.gbtn.on.e{border-color:var(--blue);color:#fff;background:#1d3b66}
.gbtn.on.k{border-color:var(--pink);color:#fff;background:#6a1640}
.plist{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.player{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px 16px;border-radius:14px;font-size:17px}
.player button{background:none;border:0;color:var(--mut);font-size:22px}
.turn{text-align:center;margin:10px 0}
.turn .who{font-size:34px;font-weight:800}
.turn .tag{color:var(--mut);font-size:14px}
.taskcard{background:var(--card);border-radius:26px;padding:26px 22px;margin:16px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:22px;line-height:1.4;border:2px solid #5a3a8a}
.taskcard.truth{border-color:var(--blue)}.taskcard.dare{border-color:var(--pink)}
.taskcard .kind{font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;color:var(--mut)}
.lvl{display:flex;gap:8px;justify-content:center;margin:0 0 6px}
.lvl button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid #5a3a8a;background:var(--card);color:var(--mut);font-weight:700;font-size:14px}
.lvl button.on{color:#fff;border-color:var(--pink);background:#6a1640}
.spacer{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top button{background:none;border:0;color:var(--mut);font-size:15px;padding:8px}
.timer{font-size:15px;color:var(--mut);text-align:center;min-height:20px}
.warn{background:#3b0d2a;border:1px solid #ff2d5588;border-radius:16px;padding:16px;font-size:15px;color:#ffd0dc;margin:16px 0;line-height:1.5}
</style>
</head>

const S={screen:"home",mode:null,players:[],turn:0,level:1,task:null,used:{},tempGender:null};
const app=document.getElementById('app');
const el=(h)=>{app.innerHTML=h;window.scrollTo(0,0)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('tod',JSON.stringify({mode:S.mode,players:S.players}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('tod'))}catch(e){return null}}

/* ============ EKRANLAR ============ */
function home(){
 S.screen="home";
 el(`<div class="spacer"></div>
 <h1>🔥 Doğruluk mu<br>Cesaret mi? 🔥</h1>
 <p class="sub">Reklamsız. Ücretsiz. Hepsi açık.</p>
 <div class="stack">
  <button class="modecard f" onclick="pickMode('friend')"><b>👯 Arkadaş Modu</b><span>Eğlenceli, komik, sıkıntısız. 2+ oyuncu.</span></button>
  <button class="modecard c" onclick="pickMode('couple')"><b>❤️‍🔥 Sevgili Modu</b><span>Çiftler için ateşli, fiziksel görevler. 18+</span></button>
 </div>
 <div class="spacer"></div>`);
}
function pickMode(m){
 if(m==='couple' && !sessionStorageOK()){ }
 if(m==='couple'){
  el(`<div class="spacer"></div><h2>18+ Uyarısı</h2>
  <div class="warn">Sevgili modu yetişkin çiftler içindir. Tüm görevler karşılıklı rıza ile yapılmalıdır. Rahat hissetmediğin her görevi "Pas" geçebilirsin. Sınırlarına saygı göster.</div>
  <div class="stack"><button class="btn red" onclick="setMode('couple')">18 yaşından büyüğüm, devam</button>
  <button class="btn ghost" onclick="home()">Geri</button></div><div class="spacer"></div>`);
 } else setMode('friend');
}
function sessionStorageOK(){return true}
function setMode(m){
 S.mode=m;S.players=[];S.turn=0;S.used={};S.level=1;
 setup();
}
function setup(){
 S.screen="setup";
 const c=S.mode==='couple';
 const need=c?2:2;
 const full=c&&S.players.length>=2;
 const list=S.players.map((p,i)=>`<div class="player"><span>${p.g==='e'?'👨':'👩'} ${esc(p.n)}</span><button onclick="rmPlayer(${i})">✕</button></div>`).join('');
 el(`<div class="top"><button onclick="home()">← Geri</button><span></span></div>
 <h2>${c?'❤️‍🔥 Çift bilgileri':'👯 Oyuncuları ekle'}</h2>
 <p class="sub">${c?'İkinizin de adını ve cinsiyetini gir':'En az 2 oyuncu ekle'}</p>
 <div class="plist">${list||'<p class="sub">Henüz kimse yok</p>'}</div>
 ${full?'':`<div class="row"><input id="nm" type="text" maxlength="16" placeholder="İsim" autocomplete="off"></div>
 <div class="row" style="margin:10px 0 14px">
  <button class="gbtn e ${S.tempGender==='e'?'on':''}" style="flex:1" onclick="setG('e')">👨 Erkek</button>
  <button class="gbtn k ${S.tempGender==='k'?'on':''}" style="flex:1" onclick="setG('k')">👩 Kadın</button>
 </div>
 <button class="btn blue" onclick="addPlayer()">+ Ekle</button>`}
 <div class="spacer"></div>
 <button class="btn pink" style="margin-top:16px;${S.players.length<need?'opacity:.4':''}" onclick="start()">Oyunu Başlat</button>`);
}
function setG(g){const v=(document.getElementById('nm')||{}).value;S.tempGender=g;setup();if(v)document.getElementById('nm').value=v}
function addPlayer(){
 const n=document.getElementById('nm').value.trim();
 if(!n){alert('İsim yaz');return}
 if(!S.tempGender){alert('Cinsiyet seç');return}
 S.players.push({n,g:S.tempGender});S.tempGender=null;save();setup();
 const i=document.getElementById('nm');if(i)i.focus();
}
function rmPlayer(i){S.players.splice(i,1);setup()}
function start(){
 if(S.players.length<2){alert('En az 2 oyuncu gerekli');return}
 S.turn=0;S.task=null;S.screen="game";save();game();
}

function cur(){return S.players[S.turn%S.players.length]}
function partner(){
 const o=cur();
 if(S.mode==='couple')return S.players.find(p=>p!==o);
 const others=S.players.filter(p=>p!==o);
 return others[Math.floor(Math.random()*others.length)];
}
function game(){
 const o=cur();
 const c=S.mode==='couple';
 const lv=c?`<div class="lvl">${['🔥 Isınma','🔥🔥 Ateşli','🔥🔥🔥 Çılgın'].map((n,i)=>`<button class="${S.level===i+1?'on':''}" onclick="setLevel(${i+1})">${n}</button>`).join('')}</div>`:'';
 const kind=S.task?(S.task.kind==='truth'?'DOĞRULUK':'CESARET'):'';
 el(`<div class="top"><button onclick="home()">← Menü</button><button onclick="scoreInfo()">👥 ${S.players.length}</button></div>
 <div class="turn"><div class="tag">Sıra</div><div class="who">${o.g==='e'?'👨':'👩'} ${esc(o.n)}</div></div>
 ${lv}
 ${S.task?`<div class="taskcard ${S.task.kind}"><div class="kind">${kind}</div>${esc(S.task.text)}</div>
   <div class="timer" id="tm"></div>
   <div class="stack"><button class="btn pink" onclick="done()">✅ Yaptım / Cevapladım</button>
   <div class="row"><button class="btn ghost" onclick="another()">🔄 Başka ver</button><button class="btn ghost" onclick="pas()">⏭ Pas</button></div></div>`
 :`<div class="taskcard"><div style="font-size:48px">${c?'❤️‍🔥':'🎲'}</div><br>Seç bakalım ${esc(o.n)}!</div>
   <div class="stack"><button class="btn blue" onclick="pick('truth')">🗣 Doğruluk</button><button class="btn pink" onclick="pick('dare')">💪 Cesaret</button></div>`}
 <div class="spacer"></div>`);
}
function setLevel(l){S.level=l;S.task=null;game()}
function scoreInfo(){alert('Oyuncular: '+S.players.map(p=>p.n).join(', '))}
function pool(kind){
 const o=cur();
 let base=S.mode==='couple'?COUPLE[kind][S.level]:FRIEND[kind];
 return base.filter(x=>!x.g||x.g===o.g);
}
function pick(kind){
 const o=cur(),p=partner();
 const base=pool(kind);
 const key=S.mode+kind+(S.mode==='couple'?S.level:'');
 S.used[key]=S.used[key]||[];
 let avail=base.filter(x=>!S.used[key].includes(x.t));
 if(!avail.length){S.used[key]=[];avail=base}
 const pickd=avail[Math.floor(Math.random()*avail.length)];
 S.used[key].push(pickd.t);
 S.task={kind,text:pickd.t.replace(/\{o\}/g,o.n).replace(/\{p\}/g,p.n),from:kind};
 game();
}
function another(){pick(S.task.kind)}
function done(){S.task=null;S.turn++;game()}
function pas(){S.task=null;S.turn++;game()}

(function init(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 home();
})();
</script>
</body>
