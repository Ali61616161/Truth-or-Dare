body[data-lv="2"]{--acc:#e8743d;--glow:rgba(232,116,61,.16)}
body[data-lv="3"]{--acc:#e5484d;--glow:rgba(229,72,77,.18)}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed;transition:background .6s}
svg{display:block;fill:currentColor}
#app{min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-family:var(--serif);font-size:46px;line-height:1.02;margin:0 0 8px;font-weight:700;letter-spacing:-1px;text-align:center}
h1 em{color:var(--acc);font-style:italic}
h2{font-family:var(--serif);font-size:30px;margin:10px 0 4px;font-weight:700;letter-spacing:-.5px;text-align:center}

.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1114}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);font-size:14px;padding:12px}
.btn[disabled]{opacity:.3;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px}.row>*{flex:1}
.spacer{flex:1}
.hero{width:190px;height:190px;margin:8px auto 14px;position:relative;animation:float 5s ease-in-out infinite}
.hero svg{width:100%;height:100%}
.langs{display:inline-flex;gap:4px}.top .langs button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;font-family:inherit}.top .langs button.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:22px 16px 20px;color:var(--txt);font:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .12s,border-color .2s}
.tile:active{transform:scale(.97)}
.tile .ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center}
.tile .ic svg{width:40px;height:40px}
.tile b{font-family:var(--serif);font-size:22px}
.tile small{color:var(--mut);font-size:13px;line-height:1.35}
.tile.v .ic{background:rgba(77,163,255,.14);color:#6fb1ff}.tile.v{border-color:rgba(77,163,255,.3)}
.tile.f .ic{background:rgba(217,165,102,.14);color:var(--gold)}
.tile.c .ic{background:rgba(229,72,77,.15);color:#e5484d}
.tile.c{border-color:rgba(229,72,77,.35)}
input[type=text]{width:100%;padding:17px;border-radius:16px;border:1px solid var(--line);background:var(--surf);color:var(--txt);font-size:17px;font-family:inherit;-webkit-user-select:text;user-select:text;outline:none}
input[type=text]:focus{border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 14px}
.seg button{padding:16px 10px;border-radius:18px;border:1px solid var(--line);background:var(--surf);color:var(--mut);font-size:16px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}

.seg button.on{border-color:var(--gold);color:var(--txt);background:var(--surf2)}
.plist{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.player{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);padding:12px 14px;border-radius:18px;font-size:17px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;border:2px solid var(--gold);color:var(--gold);flex:0 0 auto}
.av.k{border-color:#e5484d;color:#e5484d}
.player span.n{flex:1}
.player button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:38px}
.top button{background:none;border:0;color:var(--mut);font-size:15px;padding:8px 0;font-family:inherit;display:flex;align-items:center;gap:6px}
.top button svg{width:20px;height:20px}

.card.dare .kind{color:var(--acc)}
.card .kind svg{width:18px;height:18px}
.card .txt{font-family:var(--serif);font-size:27px;line-height:1.32;font-weight:600;position:relative}
.card.empty{min-height:250px;animation:none;align-items:center;text-align:center}

.choose .t svg{color:var(--gold)}.choose .d svg{color:var(--acc)}

.warn{background:var(--surf);border:1px solid #e5484d;border-radius:20px;padding:20px;font-size:15px;margin:14px 0;line-height:1.55}
.tip{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.5;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:in .2s}
.modal>div{background:var(--surf);border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);width:100%;max-width:520px;border:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surf2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--txt);font:inherit}
.opt.on{border-color:var(--acc)}
.opt b{display:block;font-size:16px}
.opt small{color:var(--mut);font-size:13px}
.opt .fl{display:flex;gap:3px;color:var(--acc);width:84px;flex:0 0 84px}
.opt .fl svg{width:14px;height:14px}
.opt .ic{width:32px;height:32px;color:var(--gold);display:grid;place-items:center}
.opt .ic svg{width:24px;height:24px}
.eico{width:68px;height:68px;margin:0 auto 14px;color:var(--acc);opacity:.85}.eico svg{width:100%;height:100%}

const HERO='<svg viewBox="0 0 200 200"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a05a"/><stop offset="1" stop-color="#e5484d"/></linearGradient></defs><circle cx="78" cy="100" r="58" fill="none" stroke="#d9a566" stroke-width="5" opacity=".9"/><circle cx="122" cy="100" r="58" fill="none" stroke="#e5484d" stroke-width="5" opacity=".9"/><path d="M100 56c2.6 11 16 17 16 31.5a16 16 0 0 1-32 0c0-6 3-10 7-13.5.6 5.5 3 8.5 6.5 9.5-1.5-10-1.5-17 2.5-27.5z" fill="url(#g1)"/></svg>';
const duo=()=>S.mode==='couple'||S.mode==='call';
const lvAttr=l=>{document.body.setAttribute('data-lv',l||1)};
function setLang(l){LANG=l;try{localStorage.setItem(LKEY,l)}catch(e){}document.documentElement.lang=l;document.title=t('title');home()}
function render(html){clearTimer();app.style.animation='none';void app.offsetWidth;app.style.animation='';app.innerHTML=html;window.scrollTo(0,0)}

function home(){
 S.task=null;lvAttr(1);
 const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 render(`<div class="top"><span></span><span class="langs"><button class="${LANG==='tr'?'on':''}" onclick="setLang('tr')">TR</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button></span></div>
 <div class="spacer"></div>
 <div class="hero">${HERO}</div>
 <h1>${t('h1a')}<br>${t('h1b')} <em>${t('h1c')}</em>${t('h1d')}</h1>
 <p class="sub">${t('sub')}</p>
 <div class="tiles">
  <button class="tile f" onclick="pickMode('friend')"><div class="ic">${IC.group}</div><b>${t('friend')}</b><small>${t('friendD')}</small></button>
  <button class="tile c" onclick="pickMode('couple')"><div class="ic">${IC.couple}</div><b>${t('couple')}</b><small>${t('coupleD')}</small></button>
 </div>
 <button class="tile v" style="width:100%;margin-top:14px;flex-direction:row;justify-content:flex-start;text-align:left" onclick="pickMode('call')"><div class="ic">${IC.video}</div><div><b>${t('video')}</b><br><small>${t('videoD')}</small></div></button>
 <div class="spacer"></div>
 ${!standalone&&ios?`<p class="tip">${t('iosTip')}</p>`:''}
 <button class="btn ghost" onclick="resetHist()">${t('reset')}</button>`);
}
function resetHist(){if(confirm(t('resetQ'))){S.hist={};persist();alert(t('resetOk'))}}
function pickMode(m){
 if(m==='couple'||m==='call'){
  render(`<div class="spacer"></div><div class="eyebrow">18+</div><h2>${t('adultH')}</h2>
  <div class="warn">${t('adultW',{n:MAX_PASS})}${m==='call'?'<br><br>'+t('callW'):''}</div>
  <div class="stack"><button class="btn main" onclick="setMode('${m}')">${t('adultOk')}</button>
  <button class="btn ghost" onclick="home()">${t('back')}</button></div><div class="spacer"></div>`);
 } else setMode('friend');
}
function setMode(m){S.mode=m;S.players=[];S.tmpG=null;setup()}
function setup(keep){
 const c=duo();
 const full=c&&S.players.length>=2;
 const ready=S.players.length>=2;
 const list=S.players.map((p,i)=>`<div class="player"><div class="av ${p.g}">${esc(p.n[0].toUpperCase())}</div><span class="n">${esc(p.n)} <small style="color:var(--mut)">· ${p.g==='e'?t('male'):t('female')}</small></span><button aria-label="x" onclick="rmPlayer(${i})">✕</button></div>`).join('');
 render(`<div class="top"><button onclick="home()">${IC.back}${t('back')}</button><span class="pill">${S.mode==='call'?t('video'):(c?t('couple'):t('friend'))}</span></div>
 <h2>${c?t('coupleInfo'):t('players')}</h2>
 <p class="sub">${c?t('coupleSub'):t('friendSub')}</p>
 <div class="plist">${list}</div>
 ${full?'':`<input id="nm" type="text" maxlength="16" placeholder="${t('name')}" autocomplete="off" autocapitalize="words" enterkeyhint="done">
 <div class="seg"><button class="${S.tmpG==='e'?'on':''}" onclick="setG('e')">${IC.male}${t('male')}</button><button class="${S.tmpG==='k'?'on':''}" onclick="setG('k')">${IC.female}${t('female')}</button></div>
 <button class="btn gold" onclick="addPlayer()">＋ ${t('add')}</button>`}
 <div class="spacer"></div>
 <button class="btn main" style="margin-top:18px" ${ready?'':'disabled'} onclick="start()">${t('startGame')}</button>`);
 const i=document.getElementById('nm');if(i){if(keep)i.value=keep;i.addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()})}
}
function setG(g){const v=(document.getElementById('nm')||{}).value||'';S.tmpG=g;setup(v)}
function addPlayer(){
 const n=(document.getElementById('nm').value||'').trim();
 if(!n){alert(t('needName'));return}
 if(!S.tmpG){alert(t('needGender'));return}
 if(S.players.some(p=>p.n.toLowerCase()===n.toLowerCase())){alert(t('dupName'));return}
 S.players.push({n,g:S.tmpG});S.tmpG=null;setup();
}
function rmPlayer(i){S.players.splice(i,1);setup()}
function start(){
 if(S.players.length<2){alert(t('needTwo'));return}
 S.turn=0;S.lvMode='auto';S.task=null;S.passes=S.players.map(()=>MAX_PASS);persist();game();
}

const cur=()=>S.players[S.turn%S.players.length];
const curIdx=()=>S.turn%S.players.length;
const roundNo=()=>Math.floor(S.turn/S.players.length)+1;
function autoLevel(){return Math.min(4,1+Math.floor((roundNo()-1)/3))}
function effLevel(){
 if(S.lvMode==='auto')return autoLevel();
 if(S.lvMode==='random')return 1+Math.floor(Math.random()*4);
 return S.lvMode;
}
function lvNote(){
 if(S.lvMode==='auto')return t('nAuto',{l:LVN(autoLevel())});
 if(S.lvMode==='random')return t('nRandom');
 return t('nFixed',{l:LVN(S.lvMode)});
}
function partnerOf(o){const others=S.players.filter(p=>p!==o);return others[Math.floor(Math.random()*others.length)]}
function game(){
 const o=cur(),c=duo();
 const left=S.passes[curIdx()];
 const lvNow=c?(S.task?S.task.lv:(S.lvMode==='auto'?autoLevel():(S.lvMode==='random'?0:S.lvMode))):1;
 lvAttr(lvNow||autoLevel());
 const hearts=Array.from({length:MAX_PASS},(_,i)=>IC.heart.replace('<svg','<svg class="'+(i<left?'':'off')+'"')).join('');
 const shownLv=S.task?S.task.lv:(S.lvMode==='random'?0:(S.lvMode==='auto'?autoLevel():S.lvMode));
 const flames=Array.from({length:4},(_,i)=>IC.flame.replace('<svg','<svg class="'+(i<shownLv?'on':'')+'"')).join('');
 const modeLabel=S.lvMode==='auto'?t('auto'):(S.lvMode==='random'?t('random'):LVN(S.lvMode));
 const lvrow=c?`<div class="lvrow"><div class="flames">${flames}</div><button class="modebtn" onclick="levelSheet()">${modeLabel}${IC.chev}</button></div>`:'';
 const tk=S.task;
 let body;
 if(tk){
  const secs=timeOf(tk.text);
  const k=tk.kind==='truth';
  body=`<div class="card ${tk.kind}"><div class="wm">${k?IC.chat:IC.bolt}</div><div class="kind">${k?IC.chat:IC.bolt}${k?t('TRUTH'):t('DARE')}</div><div class="txt">${esc(tk.text)}</div></div>
  ${secs?`<div class="timer" id="tm"><button onclick="startTimer(${secs})">${t('timer')} · ${fmt(secs)}</button></div>`:''}
  <div class="stack"><button class="btn main" onclick="done()">${IC.check}${t('done')}</button>
  <button class="btn" ${left?'':'disabled'} onclick="pas()">${IC.skip}${t('pass',{n:left})}</button></div>`;
 } else {
  body=`<div class="card empty"><div class="eico">${c?IC.couple:IC.group}</div><div class="txt">${esc(t('choose',{n:o.n}))}</div></div>
  <div class="choose"><button class="t" onclick="pick('truth')">${IC.chat}${t('truth')}</button><button class="d" onclick="pick('dare')">${IC.bolt}${t('dare')}</button></div>`;
 }
 render(`<div class="top"><button onclick="menu()">${IC.menu}</button><span class="pill">${t('round')} ${roundNo()}</span></div>
 <div class="who"><div class="av ${o.g}">${esc(o.n[0].toUpperCase())}</div><div class="nm">${esc(o.n)}</div><div class="hearts">${hearts}</div></div>
 ${lvrow}${body}<div class="spacer"></div>`);
}
function levelSheet(){
 const m=document.createElement('div');m.className='modal';
 const fl=n=>Array.from({length:n},()=>IC.flame).join('');
 const opt=(v,ic,title,desc)=>`<button class="opt ${S.lvMode===v?'on':''}" data-v="${v}"><span class="ic">${ic}</span><span style="flex:1"><b>${title}</b><small>${desc}</small></span></button>`;
 const lvo=l=>`<button class="opt ${S.lvMode===l?'on':''}" data-v="${l}"><span class="fl">${fl(l)}</span><span style="flex:1"><b>${LVN(l)}</b></span></button>`;
 m.innerHTML=`<div class="stack" style="gap:10px"><h2 style="margin:0 0 4px">${t('levels')}</h2>
 ${opt('auto',IC.auto,t('auto'),t('autoD'))}${opt('random',IC.dice,t('random'),t('randomD'))}
 ${[1,2,3,4].map(lvo).join('')}</div>`;
 document.body.appendChild(m);
 m.addEventListener('click',e=>{if(e.target===m){m.remove();return}const b=e.target.closest('.opt');if(b){m.remove();setLv(b.dataset.v)}});
}
function menu(){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="stack"><h2 style="margin:0 0 6px">${t('menu')}</h2><button class="btn" id="mm1">${t('cont')}</button><button class="btn" id="mm2">${t('chPlayers')}</button><button class="btn" id="mm3">${t('home')}</button></div>`;
 document.body.appendChild(m);
 const close=()=>m.remove();
 m.addEventListener('click',e=>{if(e.target===m)close()});
 m.querySelector('#mm1').onclick=close;
 m.querySelector('#mm2').onclick=()=>{close();setup()};
 m.querySelector('#mm3').onclick=()=>{close();home()};
}
function setLv(v){S.lvMode=(v==='auto'||v==='random')?v:Number(v);S.task=null;game()}
/* Havuz: TR dizisi kimlik (geçmiş için), EN dizisi aynı sıradaki çeviri */
function srcArr(src,kind,lv){
 if(!src)return null;
 if(S.mode==='call')return ((src.call||{})[kind]||{})[lv];
 return S.mode==='couple'?((src.couple||{})[kind]||{})[lv]:(src.friend||{})[kind];
}
function poolFor(kind,o,lv){
 const tr=srcArr(TASKS,kind,lv);
 if(!Array.isArray(tr)||!tr.length)return [];
 const en=(LANG==='en'&&typeof TASKS_EN!=='undefined')?srcArr(TASKS_EN,kind,lv):null;
 const par=duo()?S.players.find(x=>x!==o):null;
 const out=[];
 tr.forEach((s,i)=>{
  const m=/^([ek])(?:>([ek]))?\|/.exec(s);
  if(m){if(m[1]!==o.g)return;if(m[2]&&(!par||par.g!==m[2]))return}
  const id=s.replace(/^[ek](?:>[ek])?\|/,'');
  const txt=(en&&en[i])?en[i].replace(/^[ek](?:>[ek])?\|/,''):id;
  out.push({id,text:txt});
 });
 return out;
}
function pick(kind){
 const o=cur();let lv=effLevel();
 const keyOf=l=>[S.mode,kind,duo()?l:0].join('.');
 let base=poolFor(kind,o,lv);
 if(!base.length){alert(t('noTask'));return}
 let used=S.hist[keyOf(lv)]=S.hist[keyOf(lv)]||[];
 let avail=base.filter(x=>!used.includes(x.id)),useLv=lv;
 if(!avail.length&&duo()){
  for(const l of [lv+1,lv-1,lv+2,lv-2,lv+3,lv-3]){
   if(l<1||l>4)continue;
   const u2=S.hist[keyOf(l)]=S.hist[keyOf(l)]||[];
   const a2=poolFor(kind,o,l).filter(x=>!u2.includes(x.id));
   if(a2.length){avail=a2;useLv=l;break}
  }
 }
 if(!avail.length){S.hist[keyOf(lv)]=[];avail=base;useLv=lv}
 let cand=avail;
 const untimed=avail.filter(y=>!timeOf(y.text));
 if(untimed.length&&(Math.random()<0.8||untimed.length===avail.length))cand=untimed;
 const x=cand[Math.floor(Math.random()*cand.length)];
 S.hist[keyOf(useLv)].push(x.id);persist();
 const p=duo()?(S.players.find(y=>y!==o)||o):partnerOf(o);
 S.task={kind,lv:duo()?useLv:0,text:x.text.replace(/\{p\}/g,p.n).replace(/\{o\}/g,o.n)};
 vib(15);game();
}
function advance(){S.task=null;S.turn++;game()}
function done(){vib([10,30,10]);advance()}
function pas(){
 const i=curIdx();
 if(S.passes[i]<=0){alert(t('noPass'));return}
 S.passes[i]--;advance();
}
function timeOf(s){const m=/(\d+)[\s-]*(saniye|dakika|dk|seconds?|minutes?|sec|min)/i.exec(s);if(!m)return 0;const n=+m[1];return /^(sa|se)/i.test(m[2])?n:n*60}
const fmt=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s} ${LANG==='en'?'sec':'sn'}`;
function clearTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function startTimer(sec){
 clearTimer();S.tleft=sec;const box=document.getElementById('tm');
 const show=()=>{box.innerHTML=`<div class="big">${S.tleft>=60?fmt(S.tleft):S.tleft}</div>`};show();
 S.timer=setInterval(()=>{S.tleft--;if(S.tleft<=0){clearTimer();box.innerHTML=`<div class="big">${t('timeUp')}</div>`;vib([200,100,200])}else show()},1000);
}
window.addEventListener('error',e=>{app.innerHTML=`<div class="warn">${t('err')}: ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">${t('restart')}</button></div>`});
document.documentElement.lang=LANG;document.title=t('title');
if(typeof TASKS==='undefined'){app.innerHTML=`<div class="warn">${t('noLoad')}</div>`}
else{restore();home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
